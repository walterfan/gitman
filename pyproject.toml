[project]
name = "gitman"
version = "0.1.0"
description = "Local git expert: natural language to planned git commands."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "click>=8.1.0,<9.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.32.0,<1.0.0",
]

[project.scripts]
gitman = "gitman.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
